apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-node
  labels:
    app: frontend-node
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend-node
  template:
    metadata:
      labels:
        app: frontend-node
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: frontend-node
          image: docker.io/rasec777/frontend-node
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: API_BASE_URL
              value: http://api-quarkus:8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-node
  labels:
    app: frontend-node
spec:
  type: LoadBalancer
  selector:
    app: frontend-node
  ports:
    - name: http
      port: 80
      targetPort: http
