apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-quarkus
  labels:
    app: api-quarkus
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-quarkus
  template:
    metadata:
      labels:
        app: api-quarkus
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      containers:
        - name: api-quarkus
          image: docker.io/rasec777/api-quarkus
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: api-quarkus
  labels:
    app: api-quarkus
spec:
  type: ClusterIP
  selector:
    app: api-quarkus
  ports:
    - name: http
      port: 8080
      targetPort: http
