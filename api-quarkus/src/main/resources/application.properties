quarkus.application.name=api-quarkus
quarkus.http.host=0.0.0.0
quarkus.http.port=${PORT:8080}

# CORS (el frontend usa proxy server-side, esto es solo para pruebas directas desde el navegador)
quarkus.http.cors=true
quarkus.http.cors.origins=${CORS_ORIGINS:/.*/}

# OpenAPI / Swagger UI disponibles también en prod
quarkus.smallrye-openapi.path=/q/openapi
quarkus.swagger-ui.always-include=true

# Native (GraalVM CE): builder UBI9 para que coincida con la imagen runtime ubi9-quarkus-micro-image
quarkus.native.builder-image=quay.io/quarkus/ubi9-quarkus-graalvmce-builder-image:jdk-21

quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] %s%e%n

# Access log de cada petición HTTP (sin las probes de salud de Kubernetes)
quarkus.http.access-log.enabled=true
quarkus.http.access-log.pattern=%h "%r" %s %b %Dms
quarkus.http.access-log.exclude-pattern=/q/health.*
quarkus.http.record-request-start-time=true
