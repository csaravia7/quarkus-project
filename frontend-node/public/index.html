<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#101916" />
  <title>Product inventory</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="Product operations home">
      <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
      <span>PRODUCT <strong>OPS</strong></span>
    </a>
    <div class="topbar-meta"><span class="status-dot"></span>CATALOG / 01</div>
  </header>

  <main class="workspace">
    <section class="page-heading" aria-labelledby="page-title">
      <div>
        <p class="eyebrow">PRODUCT OPERATIONS <span>/</span> CATALOG</p>
        <h1 id="page-title">Inventory</h1>
      </div>
      <button id="add-product" class="button button-primary" type="button">Add product <span aria-hidden="true">+</span></button>
    </section>

    <section class="metrics" aria-label="Catalog summary">
      <div class="metric">
        <span class="metric-label">PRODUCTS</span>
        <strong id="product-count">0</strong>
      </div>
      <div class="metric">
        <span class="metric-label">CATALOG VALUE</span>
        <strong id="catalog-value">$0.00</strong>
      </div>
      <div class="metric-note"><span class="status-dot"></span>LIVE CATALOG</div>
    </section>

    <section class="catalog" aria-labelledby="catalog-title">
      <div class="catalog-heading">
        <div>
          <h2 id="catalog-title">Products</h2>
          <p>Catalog records</p>
        </div>
        <label class="search-field" for="product-search">
          <span aria-hidden="true">⌕</span>
          <input id="product-search" type="search" placeholder="Search products" autocomplete="off" />
        </label>
      </div>

      <p id="error" class="message error" role="alert" hidden></p>
      <p id="notice" class="message notice" role="status" aria-live="polite" hidden></p>

      <div class="table-wrap">
        <table>
          <thead>
            <tr><th scope="col">ID</th><th scope="col">Product</th><th scope="col">Price (USD)</th><th scope="col">Actions</th></tr>
          </thead>
          <tbody id="products" aria-live="polite"></tbody>
        </table>
      </div>
    </section>
  </main>

  <dialog id="product-dialog" class="product-dialog" aria-labelledby="dialog-title">
    <form id="product-form">
      <div class="dialog-heading">
        <div>
          <p class="eyebrow">CATALOG RECORD</p>
          <h2 id="dialog-title">Add product</h2>
        </div>
        <button id="close-dialog" class="close-button" type="button" aria-label="Close dialog">×</button>
      </div>
      <input id="product-id" type="hidden" />
      <label class="form-field" for="name">
        <span>Product name</span>
        <input id="name" name="name" type="text" maxlength="120" required autocomplete="off" />
      </label>
      <label class="form-field" for="price">
        <span>Price <small>USD</small></span>
        <input id="price" name="price" type="number" step="0.01" min="0" required inputmode="decimal" />
      </label>
      <div class="dialog-actions">
        <button id="cancel-dialog" class="button button-secondary" type="button">Cancel</button>
        <button id="save-product" class="button button-primary" type="submit">Create product</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
